<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сборка ПК — проверка совместимости</title>
<style>
  :root{
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2430;
    --line: #2a3340;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #4fd1a5;
    --warn: #f0b429;
    --bad: #ef5350;
    --mono: "JetBrains Mono", "Fira Code", monospace;
    --sans: "Inter", -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(79,209,165,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:32px 20px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{margin-bottom:32px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 8px;
  }
  h1{
    margin:0 0 8px;
    font-size:32px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  header p{color:var(--muted);margin:0;font-size:14px;}

  .grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:720px){ .grid{grid-template-columns:1fr 1fr;} }

  .part{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
  }
  .part label{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin-bottom:8px;
  }
  select{
    width:100%;
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    font-size:14px;
    font-family:var(--sans);
    appearance:none;
    cursor:pointer;
  }
  select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .spec{font-size:12px;color:var(--muted);margin-top:8px;font-family:var(--mono);}

  .search-box{
    width:100%;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    font-size:13px;
    font-family:var(--sans);
    margin-bottom:8px;
  }
  .search-box::placeholder{color:var(--muted);}
  .search-box:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .dns-link{
    display:inline-block;
    margin-top:8px;
    font-size:12px;
    font-family:var(--mono);
    color:var(--accent);
    text-decoration:none;
  }
  .dns-link:hover{text-decoration:underline;}

  .result{
    margin-top:28px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel);
    padding:20px;
  }
  .result h2{
    margin:0 0 14px;
    font-size:14px;
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
  }
  .status-line{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .status-line:last-child{border-bottom:none;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    margin-top:5px;flex-shrink:0;
  }
  .ok .dot{background:var(--accent);}
  .ok{color:var(--text);}
  .bad .dot{background:var(--bad);}
  .bad{color:#ffb4b0;}

  .summary{
    margin-top:16px;
    padding:14px;
    border-radius:8px;
    font-family:var(--mono);
    font-size:13px;
  }
  .summary.pass{background:rgba(79,209,165,0.1);border:1px solid rgba(79,209,165,0.3);color:var(--accent);}
  .summary.fail{background:rgba(239,83,80,0.1);border:1px solid rgba(239,83,80,0.3);color:#ffb4b0;}

  .price{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:var(--mono);
    border-top:1px dashed var(--line);
    padding-top:16px;
  }
  .price .label{color:var(--muted);font-size:13px;}
  .price .value{font-size:22px;font-weight:700;color:var(--text);}

  .vs-controls{margin-bottom:16px;}
  #vsCategory{
    width:100%;
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    font-size:13px;
    font-family:var(--mono);
    margin-bottom:12px;
  }
  .vs-pickers{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:10px;
    align-items:center;
  }
  .vs-pickers select{font-size:13px;padding:8px 10px;}
  .vs-versus{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
  .vs-table{
    width:100%;
    border-collapse:collapse;
    margin-top:18px;
    font-size:13px;
  }
  .vs-table th{
    text-align:left;
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    padding:8px 10px;
    border-bottom:1px solid var(--line);
  }
  .vs-table td{
    padding:10px;
    border-bottom:1px solid var(--line);
  }
  .vs-table tr:last-child td{border-bottom:none;}
  .vs-win{color:var(--accent);font-weight:600;}
  .vs-row-label{color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap;}

  .vs-bars{margin-top:20px;}
  .vs-bars-title{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    margin-bottom:12px;
  }
  .vs-bar-row{margin-bottom:14px;}
  .vs-bar-name{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:6px;
  }
  .vs-bar-name .val{font-family:var(--mono);color:var(--muted);}
  .vs-bar-track{
    width:100%;
    height:10px;
    background:var(--panel-2);
    border-radius:5px;
    overflow:hidden;
  }
  .vs-bar-fill{
    height:100%;
    border-radius:5px;
    background:var(--line);
    transition:width 0.3s ease;
  }
  .vs-bar-fill.winner{background:var(--accent);}

  .add-custom-toggle{
    display:inline-block;
    margin:6px 0 0;
    font-size:12px;
    font-family:var(--mono);
    color:var(--muted);
    background:none;
    border:1px dashed var(--line);
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
    width:100%;
    text-align:center;
  }
  .add-custom-toggle:hover{color:var(--accent);border-color:var(--accent);}
  .custom-form{
    margin-top:10px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    display:none;
  }
  .custom-form.open{display:block;}
  .custom-form label{
    display:block;
    font-size:11px;
    color:var(--muted);
    font-family:var(--mono);
    margin:8px 0 4px;
  }
  .custom-form label:first-child{margin-top:0;}
  .custom-form input, .custom-form select{
    width:100%;
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:7px 9px;
    font-size:13px;
    font-family:var(--sans);
  }
  .custom-form button{
    margin-top:10px;
    width:100%;
    background:var(--accent);
    color:#0e1116;
    border:none;
    border-radius:6px;
    padding:8px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .custom-form button:hover{opacity:0.9;}
  .unknown .dot{background:var(--warn);}
  .unknown{color:#f5d78a;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">// pc-builder.local</p>
    <h1>Собери свой ПК</h1>
    <p>Выбирай детали — совместимость и цена посчитаются автоматически.</p>
  </header>

  <div class="grid" id="parts"></div>

  <div class="result">
    <h2>Проверка совместимости</h2>
    <div id="statusList"></div>
    <div id="summary" class="summary"></div>
    <div class="price">
      <span class="label">Итого за сборку</span>
      <span class="value" id="totalPrice">0 ₽</span>
    </div>
  </div>

  <div class="result">
    <h2>Сравнить две детали (VS)</h2>
    <div class="vs-controls">
      <select id="vsCategory"></select>
      <div class="vs-pickers">
        <select id="vsItemA"></select>
        <span class="vs-versus">VS</span>
        <select id="vsItemB"></select>
      </div>
    </div>
    <div id="vsResult"></div>
  </div>
</div>

<script>
// ---------- База комплектующих ----------
// socket / ram / формат — параметры для проверки совместимости
const DATA = {
  cpu: [
    { id:"r5-7600",    name:"AMD Ryzen 5 7600",      socket:"AM5",     ram:"DDR5", tdp:65,  price:18000, score:62 },
    { id:"r5-7600x",   name:"AMD Ryzen 5 7600X",     socket:"AM5",     ram:"DDR5", tdp:105, price:22000, score:66 },
    { id:"r7-7700",    name:"AMD Ryzen 7 7700",      socket:"AM5",     ram:"DDR5", tdp:65,  price:26000, score:74 },
    { id:"r7-7800x3d", name:"AMD Ryzen 7 7800X3D",   socket:"AM5",     ram:"DDR5", tdp:120, price:33000, score:86 },
    { id:"r9-7900x",   name:"AMD Ryzen 9 7900X",     socket:"AM5",     ram:"DDR5", tdp:170, price:39000, score:90 },
    { id:"i3-13100f",  name:"Intel Core i3-13100F",  socket:"LGA1700", ram:"DDR4", tdp:58,  price:9000,  score:48 },
    { id:"i5-13400f",  name:"Intel Core i5-13400F",  socket:"LGA1700", ram:"DDR4", tdp:65,  price:15000, score:60 },
    { id:"i5-14600kf", name:"Intel Core i5-14600KF", socket:"LGA1700", ram:"DDR5", tdp:125, price:24000, score:75 },
    { id:"i7-14700k",  name:"Intel Core i7-14700K",  socket:"LGA1700", ram:"DDR5", tdp:125, price:32000, score:88 },
    { id:"i9-14900k",  name:"Intel Core i9-14900K",  socket:"LGA1700", ram:"DDR5", tdp:125, price:48000, score:94 },
  ],
  mb: [
    { id:"a620",    name:"Материнка A620 (AM5)",             socket:"AM5",     ram:"DDR5", price:9000  },
    { id:"b650",    name:"Материнка B650 (AM5)",             socket:"AM5",     ram:"DDR5", price:14000 },
    { id:"x670",    name:"Материнка X670 (AM5)",             socket:"AM5",     ram:"DDR5", price:22000 },
    { id:"h610",    name:"Материнка H610 (LGA1700, DDR4)",   socket:"LGA1700", ram:"DDR4", price:7000  },
    { id:"b760d4",  name:"Материнка B760 (LGA1700, DDR4)",   socket:"LGA1700", ram:"DDR4", price:9000  },
    { id:"b760d5",  name:"Материнка B760 (LGA1700, DDR5)",   socket:"LGA1700", ram:"DDR5", price:12000 },
    { id:"z790",    name:"Материнка Z790 (LGA1700, DDR5)",   socket:"LGA1700", ram:"DDR5", price:24000 },
  ],
  ram: [
    { id:"ddr4-8",  name:"8 ГБ DDR4-3200",   type:"DDR4", price:2800,  capacityGB:8  },
    { id:"ddr4-16", name:"16 ГБ DDR4-3200",  type:"DDR4", price:5200,  capacityGB:16 },
    { id:"ddr4-32", name:"32 ГБ DDR4-3200",  type:"DDR4", price:10500, capacityGB:32 },
    { id:"ddr5-16", name:"16 ГБ DDR5-6000",  type:"DDR5", price:22000, capacityGB:16 },
    { id:"ddr5-32", name:"32 ГБ DDR5-6000",  type:"DDR5", price:46000, capacityGB:32 },
    { id:"ddr5-64", name:"64 ГБ DDR5-6000",  type:"DDR5", price:95000, capacityGB:64 },
  ],
  gpu: [
    { id:"rtx4060",   name:"RTX 4060",        tdp:115, price:32000,  score:58 },
    { id:"rtx4060ti", name:"RTX 4060 Ti",     tdp:165, price:42000,  score:66 },
    { id:"rtx4070",   name:"RTX 4070",        tdp:200, price:54000,  score:75 },
    { id:"rtx4070s",  name:"RTX 4070 Super",  tdp:220, price:62000,  score:80 },
    { id:"rtx4070ti", name:"RTX 4070 Ti Super", tdp:285, price:88000, score:87 },
    { id:"rtx4080s",  name:"RTX 4080 Super",  tdp:320, price:110000, score:93 },
    { id:"rx7600",    name:"RX 7600",         tdp:165, price:26000,  score:54 },
    { id:"rx7800xt",  name:"RX 7800 XT",      tdp:263, price:52000,  score:76 },
    { id:"rx7900xt",  name:"RX 7900 XT",      tdp:315, price:78000,  score:88 },
  ],
  psu: [
    { id:"psu450",  name:"Блок питания 450 Вт", watt:450, price:4500  },
    { id:"psu550",  name:"Блок питания 550 Вт", watt:550, price:6000  },
    { id:"psu650",  name:"Блок питания 650 Вт", watt:650, price:8000  },
    { id:"psu750",  name:"Блок питания 750 Вт", watt:750, price:9500  },
    { id:"psu850",  name:"Блок питания 850 Вт", watt:850, price:11000 },
    { id:"psu1000", name:"Блок питания 1000 Вт", watt:1000, price:14500 },
  ],
  storage: [
    { id:"ssd500",  name:"SSD NVMe 500 ГБ",  price:4000,  capacityGB:500  },
    { id:"ssd1tb",  name:"SSD NVMe 1 ТБ",    price:7000,  capacityGB:1000 },
    { id:"ssd2tb",  name:"SSD NVMe 2 ТБ",    price:13000, capacityGB:2000 },
    { id:"hdd2tb",  name:"HDD 2 ТБ",         price:5000,  capacityGB:2000 },
  ],
  case: [
    { id:"case-budget",  name:"Корпус бюджетный",       price:3500  },
    { id:"case-mid",     name:"Корпус со стеклом/RGB",  price:6500  },
    { id:"case-premium", name:"Корпус премиум",         price:12000 },
  ]
};

const LABELS = { cpu:"Процессор", mb:"Материнская плата", ram:"Оперативная память", gpu:"Видеокарта", psu:"Блок питания", storage:"Накопитель", case:"Корпус" };

// Доп. поля, которые нужно спросить у пользователя, если он добавляет свой вариант детали —
// без них не получится проверить совместимость или посчитать полосу мощности
const CUSTOM_FIELDS = {
  cpu:     [{key:"socket", label:"Сокет", type:"select", options:["AM5","LGA1700"]},
            {key:"ram",    label:"Тип памяти", type:"select", options:["DDR4","DDR5"]},
            {key:"tdp",    label:"TDP, Вт", type:"number", default:65},
            {key:"score",  label:"Производительность (0–100, ориентировочно)", type:"number", default:60}],
  mb:      [{key:"socket", label:"Сокет", type:"select", options:["AM5","LGA1700"]},
            {key:"ram",    label:"Тип памяти", type:"select", options:["DDR4","DDR5"]}],
  ram:     [{key:"type",       label:"Тип памяти", type:"select", options:["DDR4","DDR5"]},
            {key:"capacityGB", label:"Объём, ГБ", type:"number", default:16}],
  gpu:     [{key:"tdp",   label:"TDP, Вт", type:"number", default:150},
            {key:"score", label:"Производительность (0–100, ориентировочно)", type:"number", default:60}],
  psu:     [{key:"watt", label:"Мощность, Вт", type:"number", default:650}],
  storage: [{key:"capacityGB", label:"Объём, ГБ", type:"number", default:500}],
  case:    []
};

// Ссылки на соответствующие категории в DNS — переходишь и смотришь актуальные цены и наличие
const DNS_LINKS = {
  cpu:     "https://www.dns-shop.ru/catalog/17a899cd16404e77/processory/",
  mb:      "https://www.dns-shop.ru/catalog/17a89a0416404e77/materinskie-platy/",
  gpu:     "https://www.dns-shop.ru/catalog/17a89aab16404e77/videokarty/",
  psu:     "https://www.dns-shop.ru/catalog/17a89c2216404e77/bloki-pitania/",
  ram:     "https://www.dns-shop.ru/catalog/recipe/4e4a9b02549e8ef4/ddr5/",
  storage: "https://www.dns-shop.ru/catalog/8a9ddfba20724e77/ssd-nakopiteli/",
  case:    "https://www.dns-shop.ru/catalog/recipe/b31746e9fd5af8c9/mini-tower/"
};

// ---------- Рендер выпадающих списков с поиском ----------
const partsEl = document.getElementById("parts");

function fillSelect(select, key, items){
  const prevValue = select.value;
  select.innerHTML = "";
  if(items.length === 0){
    const opt = document.createElement("option");
    opt.textContent = "Ничего не найдено";
    opt.disabled = true;
    select.appendChild(opt);
    return;
  }
  items.forEach(item=>{
    const opt = document.createElement("option");
    opt.value = item.id;
    opt.textContent = `${item.name} — ${item.price.toLocaleString("ru-RU")} ₽`;
    select.appendChild(opt);
  });
  // сохраняем прошлый выбор, если он всё ещё есть среди отфильтрованных
  if(items.some(i=>i.id===prevValue)) select.value = prevValue;
}

Object.keys(DATA).forEach(key=>{
  const box = document.createElement("div");
  box.className = "part";

  const label = document.createElement("label");
  label.textContent = LABELS[key];

  const search = document.createElement("input");
  search.type = "text";
  search.className = "search-box";
  search.placeholder = "Поиск по названию...";

  const select = document.createElement("select");
  select.id = key;
  fillSelect(select, key, DATA[key]);

  search.addEventListener("input", ()=>{
    const q = search.value.trim().toLowerCase();
    const filtered = DATA[key].filter(item=>item.name.toLowerCase().includes(q));
    fillSelect(select, key, filtered);
    update();
  });
  select.addEventListener("change", update);

  const link = document.createElement("a");
  link.className = "dns-link";
  link.href = DNS_LINKS[key];
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "Смотреть варианты и актуальные цены на DNS →";

  // ---- кнопка и форма "добавить свой вариант" ----
  const toggleBtn = document.createElement("button");
  toggleBtn.type = "button";
  toggleBtn.className = "add-custom-toggle";
  toggleBtn.textContent = "+ Добавить свой вариант";

  const form = document.createElement("div");
  form.className = "custom-form";

  const nameLabel = document.createElement("label");
  nameLabel.textContent = "Название";
  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.placeholder = "Например: моя видеокарта";

  const priceLabel = document.createElement("label");
  priceLabel.textContent = "Цена, ₽";
  const priceInput = document.createElement("input");
  priceInput.type = "number";
  priceInput.min = "0";
  priceInput.placeholder = "0";

  form.appendChild(nameLabel);
  form.appendChild(nameInput);
  form.appendChild(priceLabel);
  form.appendChild(priceInput);

  // доп. поля из CUSTOM_FIELDS, нужные для совместимости/полос мощности
  const extraInputs = {};
  (CUSTOM_FIELDS[key] || []).forEach(field=>{
    const fLabel = document.createElement("label");
    fLabel.textContent = field.label;
    let input;
    if(field.type === "select"){
      input = document.createElement("select");
      field.options.forEach(o=>{
        const opt = document.createElement("option");
        opt.value = o;
        opt.textContent = o;
        input.appendChild(opt);
      });
    } else {
      input = document.createElement("input");
      input.type = "number";
      input.value = field.default;
    }
    extraInputs[field.key] = input;
    form.appendChild(fLabel);
    form.appendChild(input);
  });

  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.textContent = "Добавить в список";
  form.appendChild(addBtn);

  toggleBtn.addEventListener("click", ()=>{
    form.classList.toggle("open");
    if(form.classList.contains("open")) nameInput.value = search.value;
  });

  addBtn.addEventListener("click", ()=>{
    const name = nameInput.value.trim();
    if(!name){ nameInput.focus(); return; }
    const price = Number(priceInput.value) || 0;
    const newItem = { id: `custom-${key}-${Date.now()}`, name, price };
    (CUSTOM_FIELDS[key] || []).forEach(field=>{
      const raw = extraInputs[field.key].value;
      newItem[field.key] = field.type === "number" ? Number(raw) : raw;
    });
    DATA[key].push(newItem);
    search.value = "";
    fillSelect(select, key, DATA[key]);
    select.value = newItem.id;
    form.classList.remove("open");
    nameInput.value = "";
    priceInput.value = "";
    update();
    refreshVsPickers();
  });

  box.appendChild(label);
  box.appendChild(search);
  box.appendChild(select);
  box.appendChild(link);
  box.appendChild(toggleBtn);
  box.appendChild(form);
  partsEl.appendChild(box);
});

function getSelected(){
  const picked = {};
  Object.keys(DATA).forEach(key=>{
    const select = document.getElementById(key);
    picked[key] = DATA[key].find(i=>i.id===select.value) || DATA[key][0];
  });
  return picked;
}

// ---------- Логика проверки совместимости ----------
// ok: true — совместимо, false — конфликт, null — недостаточно данных (кастомная деталь)
function checkCompatibility(p){
  const checks = [];

  // 1. Сокет процессора и материнской платы
  if(p.cpu.socket == null || p.mb.socket == null){
    checks.push({ ok:null, text:"Сокет неизвестен — у одной из деталей это своя запись без указанного сокета, свери вручную" });
  } else {
    const socketOk = p.cpu.socket === p.mb.socket;
    checks.push({
      ok: socketOk,
      text: socketOk
        ? `Сокет процессора и платы совпадает (${p.cpu.socket})`
        : `Сокет не совпадает: процессор ${p.cpu.socket}, плата ${p.mb.socket}`
    });
  }

  // 2. Тип памяти: процессор ↔ плата ↔ модуль памяти
  if(p.cpu.ram == null || p.mb.ram == null || p.ram.type == null){
    checks.push({ ok:null, text:"Тип памяти неизвестен — у одной из деталей это своя запись без указанного типа, свери вручную" });
  } else {
    const ramOk = p.cpu.ram === p.mb.ram && p.mb.ram === p.ram.type;
    checks.push({
      ok: ramOk,
      text: ramOk
        ? `Тип памяти согласован (${p.ram.type})`
        : `Несовпадение памяти: процессор ждёт ${p.cpu.ram}, плата — ${p.mb.ram}, модуль — ${p.ram.type}`
    });
  }

  // 3. Мощность блока питания с запасом ~150 Вт
  if(p.cpu.tdp == null || p.gpu.tdp == null || p.psu.watt == null){
    checks.push({ ok:null, text:"Мощность блока питания не проверена — у одной из деталей нет данных по TDP/ваттам" });
  } else {
    const totalTdp = p.cpu.tdp + p.gpu.tdp + 100; // +100 Вт на остальные компоненты
    const recommended = totalTdp + 150;
    const psuOk = p.psu.watt >= recommended;
    checks.push({
      ok: psuOk,
      text: psuOk
        ? `Блока питания (${p.psu.watt} Вт) хватает с запасом`
        : `Блока питания (${p.psu.watt} Вт) не хватает — нужно от ${recommended} Вт`
    });
  }

  return checks;
}

// ---------- Обновление интерфейса ----------
function update(){
  const p = getSelected();
  const checks = checkCompatibility(p);

  const statusList = document.getElementById("statusList");
  statusList.innerHTML = "";
  checks.forEach(c=>{
    const stateClass = c.ok === null ? "unknown" : (c.ok ? "ok" : "bad");
    const row = document.createElement("div");
    row.className = "status-line " + stateClass;
    row.innerHTML = `<span class="dot"></span><span>${c.text}</span>`;
    statusList.appendChild(row);
  });

  const hasBad = checks.some(c=>c.ok === false);
  const hasUnknown = checks.some(c=>c.ok === null);
  const summary = document.getElementById("summary");
  if(hasBad){
    summary.className = "summary fail";
    summary.textContent = "✗ Есть конфликты — смотри пункты выше и замени комплектующие.";
  } else if(hasUnknown){
    summary.className = "summary fail";
    summary.textContent = "⚠ Часть проверок недоступна из-за своих вариантов деталей — сверь эти пункты вручную.";
  } else {
    summary.className = "summary pass";
    summary.textContent = "✓ Сборка совместима, можно собирать.";
  }

  const total = Object.values(p).reduce((sum,item)=>sum+item.price,0);
  document.getElementById("totalPrice").textContent = total.toLocaleString("ru-RU") + " ₽";
}

update();

// ---------- Сравнение двух деталей (VS) ----------
const VS_LABELS_RU = { cpu:"Процессоры", mb:"Материнские платы", ram:"Память", gpu:"Видеокарты", psu:"Блоки питания", storage:"Накопители", case:"Корпуса" };

const vsCategorySelect = document.getElementById("vsCategory");
const vsItemASelect = document.getElementById("vsItemA");
const vsItemBSelect = document.getElementById("vsItemB");
const vsResultEl = document.getElementById("vsResult");

Object.keys(DATA).forEach(key=>{
  const opt = document.createElement("option");
  opt.value = key;
  opt.textContent = VS_LABELS_RU[key];
  vsCategorySelect.appendChild(opt);
});

function fillVsItemSelect(select, key, defaultIndex){
  select.innerHTML = "";
  DATA[key].forEach((item, i)=>{
    const opt = document.createElement("option");
    opt.value = item.id;
    opt.textContent = item.name;
    if(i === defaultIndex) opt.selected = true;
    select.appendChild(opt);
  });
}

function refreshVsPickers(){
  const key = vsCategorySelect.value;
  fillVsItemSelect(vsItemASelect, key, 0);
  fillVsItemSelect(vsItemBSelect, key, Math.min(1, DATA[key].length - 1));
  renderVs();
}

// человекочитаемые названия характеристик для таблицы сравнения
const SPEC_LABELS = {
  price:  "Цена",
  socket: "Сокет",
  ram:    "Тип памяти",
  type:   "Тип памяти",
  tdp:    "TDP (Вт)",
  watt:   "Мощность (Вт)",
  score:  "Производительность (баллы, ориентировочно)"
};

// какой показатель считать "силой" детали для полос — и в какую сторону лучше
const PRIMARY_METRIC = {
  cpu:     { field:"score",      label:"Производительность", higherIsBetter:true  },
  gpu:     { field:"score",      label:"Производительность", higherIsBetter:true  },
  psu:     { field:"watt",       label:"Мощность, Вт",        higherIsBetter:true  },
  ram:     { field:"capacityGB", label:"Объём, ГБ",           higherIsBetter:true  },
  storage: { field:"capacityGB", label:"Объём, ГБ",           higherIsBetter:true  },
  mb:      { field:"price",      label:"Цена (меньше — лучше)", higherIsBetter:false },
  case:    { field:"price",      label:"Цена (меньше — лучше)", higherIsBetter:false }
};

function renderVs(){
  const key = vsCategorySelect.value;
  const itemA = DATA[key].find(i=>i.id===vsItemASelect.value);
  const itemB = DATA[key].find(i=>i.id===vsItemBSelect.value);
  if(!itemA || !itemB) return;

  // собираем список полей, которые есть хотя бы у одного из двух товаров (кроме id/name)
  const fields = Object.keys(itemA).filter(f=>f!=="id" && f!=="name");

  let rows = "";
  fields.forEach(field=>{
    const valA = itemA[field];
    const valB = itemB[field];
    const label = SPEC_LABELS[field] || field;

    let cellA = valA, cellB = valB;
    let classA = "", classB = "";

    if(typeof valA === "number" && typeof valB === "number"){
      cellA = field === "price" ? valA.toLocaleString("ru-RU") + " ₽" : valA;
      cellB = field === "price" ? valB.toLocaleString("ru-RU") + " ₽" : valB;
      // для цены "лучше" — меньше, для остальных числовых полей — больше
      const higherIsBetter = field !== "price";
      if(valA !== valB){
        const aWins = higherIsBetter ? valA > valB : valA < valB;
        if(aWins) classA = "vs-win"; else classB = "vs-win";
      }
    }

    rows += `<tr>
      <td class="vs-row-label">${label}</td>
      <td class="${classA}">${cellA}</td>
      <td class="${classB}">${cellB}</td>
    </tr>`;
  });

  // ---- полосы наглядного сравнения ----
  const metric = PRIMARY_METRIC[key];
  let barsHtml = "";
  if(metric && typeof itemA[metric.field] === "number" && typeof itemB[metric.field] === "number"){
    const valA = itemA[metric.field];
    const valB = itemB[metric.field];
    const aIsWinner = metric.higherIsBetter ? valA > valB : valA < valB;
    const bIsWinner = metric.higherIsBetter ? valB > valA : valB < valA;

    let widthA, widthB;
    if(metric.higherIsBetter){
      const maxVal = Math.max(valA, valB) || 1;
      widthA = (valA / maxVal) * 100;
      widthB = (valB / maxVal) * 100;
    } else {
      // меньше — лучше (например цена): переводим в "обратные" величины, чтобы более короткая полоса была у большего числа
      const invA = valA === 0 ? 0 : 1 / valA;
      const invB = valB === 0 ? 0 : 1 / valB;
      const maxInv = Math.max(invA, invB) || 1;
      widthA = (invA / maxInv) * 100;
      widthB = (invB / maxInv) * 100;
    }

    barsHtml = `
      <div class="vs-bars">
        <div class="vs-bars-title">${metric.label}</div>
        <div class="vs-bar-row">
          <div class="vs-bar-name"><span>${itemA.name}</span><span class="val">${valA}</span></div>
          <div class="vs-bar-track"><div class="vs-bar-fill ${aIsWinner ? "winner" : ""}" style="width:${Math.max(widthA,4)}%"></div></div>
        </div>
        <div class="vs-bar-row">
          <div class="vs-bar-name"><span>${itemB.name}</span><span class="val">${valB}</span></div>
          <div class="vs-bar-track"><div class="vs-bar-fill ${bIsWinner ? "winner" : ""}" style="width:${Math.max(widthB,4)}%"></div></div>
        </div>
      </div>
    `;
  }

  vsResultEl.innerHTML = `
    <table class="vs-table">
      <thead>
        <tr><th></th><th>${itemA.name}</th><th>${itemB.name}</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    ${barsHtml}
  `;
}

vsCategorySelect.addEventListener("change", refreshVsPickers);
vsItemASelect.addEventListener("change", renderVs);
vsItemBSelect.addEventListener("change", renderVs);

refreshVsPickers();
</script>
