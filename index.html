    --panel: rgba(20,16,24,0.82);

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    font-family:var(--sans);
    padding:32px 20px 80px;
    position:relative;

  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:rgba(4,4,7,0.66);
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{margin-bottom:32px;position:relative;padding-top:14px;}
  header::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:6px;
    border-radius:3px;
    background:repeating-linear-gradient(
      100deg,
      var(--accent) 0 26px,
      var(--accent2) 26px 40px,
      transparent 40px 48px
    );
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 8px;
  }
  h1{
    margin:0 0 8px;
    font-size:40px;
    font-weight:700;
    font-family:var(--display);
    letter-spacing:0.01em;
    text-transform:uppercase;
    background:linear-gradient(90deg, var(--text) 40%, var(--accent) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{color:var(--muted);margin:0;font-size:14px;}

  .grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:720px){ .grid{grid-template-columns:1fr 1fr;} }

  .part{
    background:var(--panel);
    backdrop-filter:blur(6px);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .part:hover, .part:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent), 0 0 18px rgba(255,32,73,0.25), 0 0 30px rgba(176,38,255,0.12);
  }
  .part label{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin-bottom:8px;
  }
  .part-icon{font-size:16px;line-height:1;filter:drop-shadow(0 0 6px rgba(255,32,73,0.5));}
  select{
    width:100%;
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    font-size:14px;
    font-family:var(--sans);
    appearance:none;
    cursor:pointer;
  }
  select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .spec{font-size:12px;color:var(--muted);margin-top:8px;font-family:var(--mono);}

  .search-box{
    width:100%;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    font-size:13px;
    font-family:var(--sans);
    margin-bottom:8px;
  }
  .search-box::placeholder{color:var(--muted);}
  .search-box:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .dns-link{
    display:inline-block;
    margin-top:8px;
    font-size:12px;
    font-family:var(--mono);
    color:var(--accent);
    text-decoration:none;
  }
  .dns-link:hover{text-decoration:underline;}

  .result{
    margin-top:28px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel);
    backdrop-filter:blur(6px);
    padding:20px;
  }
  .result h2{
    margin:0 0 14px;
    font-size:14px;
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
  }
  .status-line{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .status-line:last-child{border-bottom:none;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    margin-top:5px;flex-shrink:0;
  }
  .ok .dot{background:var(--ok);}
  .ok{color:var(--text);}
  .bad .dot{background:var(--bad);}
  .bad{color:#ffb4b0;}

  .summary{
    margin-top:16px;
    padding:14px;
    border-radius:8px;
    font-family:var(--mono);
    font-size:13px;
  }
  .summary.pass{background:rgba(79,209,165,0.1);border:1px solid rgba(79,209,165,0.3);color:var(--ok);}
  .summary.fail{background:rgba(255,32,73,0.12);border:1px solid rgba(255,32,73,0.35);color:#ffb4b0;}

  .price{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:var(--mono);
    border-top:1px dashed var(--line);
    padding-top:16px;
  }
  .price .label{color:var(--muted);font-size:13px;}
  .price .value{
    font-size:26px;
    font-weight:700;
    font-family:var(--display);
    color:var(--accent);
    text-shadow:0 0 14px rgba(255,32,73,0.45);
  }

  .vs-controls{margin-bottom:16px;}

    height:10px;
    background:var(--panel-2);
    border-radius:5px;
    overflow:hidden;
  }
  .vs-bar-fill{
    height:100%;
    border-radius:5px;
    background:var(--line);
    transition:width 0.3s ease;
  }
  .vs-bar-fill.winner{
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow:0 0 12px rgba(255,32,73,0.5);
  }

  .add-custom-toggle{
    display:inline-block;
    margin:6px 0 0;
    font-size:12px;
    font-family:var(--mono);
    color:var(--muted);
    background:none;
    border:1px dashed var(--line);
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
    width:100%;
    text-align:center;
  }
  .add-custom-toggle:hover{color:var(--accent);border-color:var(--accent);}
  .custom-form{
    margin-top:10px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    display:none;
  }

    display:block;

    margin:8px 0 4px;
  }

  .custom-form input, .custom-form select{

    font-family:var(--sans);
  }
  .custom-form button{

            {key:"score",    label:"Производительность (0–100, ориентировочно)", type:"number", default:60}],
  mb:      [{key:"brand",  label:"Производитель", type:"text", default:""},
            {key:"socket", label:"Сокет", type:"select", options:["AM5","LGA1700"]},
            {key:"ram",    label:"Тип памяти", type:"select", options:["DDR4","DDR5"]}],

// Ссылки на соответствующие категории в DNS — переходишь и смотришь актуальные цены и наличие
const DNS_LINKS = {
  cpu:     "https://www.dns-shop.ru/catalog/17a899cd16404e77/processory/",
  mb:      "https://www.dns-shop.ru/catalog/17a89a0416404e77/materinskie-platy/",
  gpu:     "https://www.dns-shop.ru/catalog/17a89aab16404e77/videokarty/",
  psu:     "https://www.dns-shop.ru/catalog/17a89c2216404e77/bloki-pitania/",
  ram:     "https://www.dns-shop.ru/catalog/recipe/4e4a9b02549e8ef4/ddr5/",
  storage: "https://www.dns-shop.ru/catalog/8a9ddfba20724e77/ssd-nakopiteli/",
  case:    "https://www.dns-shop.ru/catalog/recipe/b31746e9fd5af8c9/mini-tower/"
};

// ---------- Рендер выпадающих списков с поиском ----------
const partsEl = document.getElementById("parts");

function fillSelect(select, key, items){
  const prevValue = select.value;
  select.innerHTML = "";
  if(items.length === 0){
    const opt = document.createElement("option");
    opt.textContent = "Не найдено — добавьте свой вариант кнопкой ниже";
    opt.disabled = true;
    select.appendChild(opt);
    return;
  }
  items.forEach(item=>{
    const opt = document.createElement("option");
    opt.value = item.id;
    opt.textContent = `${item.name} — ${item.price.toLocaleString("ru-RU")} ₽`;
    select.appendChild(opt);
  });
  // сохраняем прошлый выбор, если он всё ещё есть среди отфильтрованных
  if(items.some(i=>i.id===prevValue)) select.value = prevValue;
}

Object.keys(DATA).forEach(key=>{
  const box = document.createElement("div");
  box.className = "part";

  const label = document.createElement("label");
  const iconSpan = document.createElement("span");
  iconSpan.className = "part-icon";
  iconSpan.textContent = ICONS[key] || "";
  const labelText = document.createElement("span");
  labelText.textContent = LABELS[key];
  label.appendChild(iconSpan);
  label.appendChild(labelText);

  const search = document.createElement("input");
  search.type = "text";
  search.className = "search-box";
  search.placeholder = "Поиск по названию...";

  const select = document.createElement("select");
  select.id = key;
  fillSelect(select, key, DATA[key]);

  search.addEventListener("input", ()=>{
    const q = search.value.trim().toLowerCase();
    const filtered = DATA[key].filter(item=>item.name.toLowerCase().includes(q));
    fillSelect(select, key, filtered);
    update();
  });
  select.addEventListener("change", update);

  const link = document.createElement("a");
  link.className = "dns-link";
  link.href = DNS_LINKS[key];
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "Смотреть варианты и актуальные цены на DNS →";

  // ---- кнопка и форма "добавить свой вариант" ----
  const toggleBtn = document.createElement("button");
  toggleBtn.type = "button";
  toggleBtn.className = "add-custom-toggle";
  toggleBtn.textContent = "+ Добавить свой вариант";

  const form = document.createElement("div");
  form.className = "custom-form";

  const nameLabel = document.createElement("label");
  nameLabel.textContent = "Название";
  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.placeholder = "Например: моя видеокарта";

  const priceLabel = document.createElement("label");
  priceLabel.textContent = "Цена, ₽";
  const priceInput = document.createElement("input");
  priceInput.type = "number";
  priceInput.min = "0";
  priceInput.placeholder = "0";

  form.appendChild(nameLabel);
  form.appendChild(nameInput);
  form.appendChild(priceLabel);
  form.appendChild(priceInput);

  // доп. поля из CUSTOM_FIELDS, нужные для совместимости/полос мощности
  const extraInputs = {};
  (CUSTOM_FIELDS[key] || []).forEach(field=>{
    const fLabel = document.createElement("label");
    fLabel.textContent = field.label;
    let input;
    if(field.type === "select"){
      input = document.createElement("select");
      field.options.forEach(o=>{
        const opt = document.createElement("option");
        opt.value = o;
        opt.textContent = o;
        input.appendChild(opt);
      });
    } else {
      input = document.createElement("input");
      input.type = "number";
      input.value = field.default;
    }
    extraInputs[field.key] = input;
    form.appendChild(fLabel);
    form.appendChild(input);
  });

  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.textContent = "Добавить в список";
  form.appendChild(addBtn);

  toggleBtn.addEventListener("click", ()=>{
    form.classList.toggle("open");
    if(form.classList.contains("open")) nameInput.value = search.value;
  });

  addBtn.addEventListener("click", ()=>{
    const name = nameInput.value.trim();
    if(!name){ nameInput.focus(); return; }
    const price = Number(priceInput.value) || 0;
    const newItem = { id: `custom-${key}-${Date.now()}`, name, price };
    (CUSTOM_FIELDS[key] || []).forEach(field=>{
      const raw = extraInputs[field.key].value;
      newItem[field.key] = field.type === "number" ? Number(raw) : raw;
    });
    DATA[key].push(newItem);
    search.value = "";
    fillSelect(select, key, DATA[key]);
    select.value = newItem.id;
    form.classList.remove("open");
    nameInput.value = "";
    priceInput.value = "";
    update();
    refreshVsPickers();
  });

  box.appendChild(label);
  box.appendChild(search);
  box.appendChild(select);
  box.appendChild(link);
  box.appendChild(toggleBtn);
  box.appendChild(form);
  partsEl.appendChild(box);
});

function getSelected(){
  const picked = {};
  Object.keys(DATA).forEach(key=>{
    const select = document.getElementById(key);
    picked[key] = DATA[key].find(i=>i.id===select.value) || DATA[key][0];
  });
  return picked;
}

// ---------- Логика проверки совместимости ----------
// ok: true — совместимо, false — конфликт, null — недостаточно данных (кастомная деталь)
function checkCompatibility(p){
  const checks = [];

  // 1. Сокет процессора и материнской платы
  if(p.cpu.socket == null || p.mb.socket == null){
    checks.push({ ok:null, text:"Сокет неизвестен — у одной из деталей это своя запись без указанного сокета, свери вручную" });
  } else {
    const socketOk = p.cpu.socket === p.mb.socket;
    checks.push({
      ok: socketOk,
      text: socketOk
        ? `Сокет процессора и платы совпадает (${p.cpu.socket})`
        : `Сокет не совпадает: процессор ${p.cpu.socket}, плата ${p.mb.socket}`
    });
  }

  // 2. Тип памяти: процессор ↔ плата ↔ модуль памяти
  if(p.cpu.ram == null || p.mb.ram == null || p.ram.type == null){
    checks.push({ ok:null, text:"Тип памяти неизвестен — у одной из деталей это своя запись без указанного типа, свери вручную" });
  } else {
    const ramOk = p.cpu.ram === p.mb.ram && p.mb.ram === p.ram.type;
    checks.push({
      ok: ramOk,
      text: ramOk
        ? `Тип памяти согласован (${p.ram.type})`
        : `Несовпадение памяти: процессор ждёт ${p.cpu.ram}, плата — ${p.mb.ram}, модуль — ${p.ram.type}`
    });
  }

  // 3. Мощность блока питания с запасом ~150 Вт
  if(p.cpu.tdp == null || p.gpu.tdp == null || p.psu.watt == null){
    checks.push({ ok:null, text:"Мощность блока питания не проверена — у одной из деталей нет данных по TDP/ваттам" });
  } else {
    const totalTdp = p.cpu.tdp + p.gpu.tdp + 100; // +100 Вт на остальные компоненты
    const recommended = totalTdp + 150;
    const psuOk = p.psu.watt >= recommended;
    checks.push({
      ok: psuOk,
      text: psuOk
        ? `Блока питания (${p.psu.watt} Вт) хватает с запасом`
        : `Блока питания (${p.psu.watt} Вт) не хватает — нужно от ${recommended} Вт`
    });
  }

  return checks;
}

// ---------- Обновление интерфейса ----------
function update(){
  const p = getSelected();
  const checks = checkCompatibility(p);

  const statusList = document.getElementById("statusList");
  statusList.innerHTML = "";
  checks.forEach(c=>{
    const stateClass = c.ok === null ? "unknown" : (c.ok ? "ok" : "bad");
    const row = document.createElement("div");
    row.className = "status-line " + stateClass;
    row.innerHTML = `<span class="dot"></span><span>${c.text}</span>`;
    statusList.appendChild(row);
  });

  const hasBad = checks.some(c=>c.ok === false);
  const hasUnknown = checks.some(c=>c.ok === null);
  const summary = document.getElementById("summary");
  if(hasBad){
    summary.className = "summary fail";
    summary.textContent = "✗ Есть конфликты — смотри пункты выше и замени комплектующие.";
  } else if(hasUnknown){
    summary.className = "summary fail";
    summary.textContent = "⚠ Часть проверок недоступна из-за своих вариантов деталей — сверь эти пункты вручную.";
  } else {
    summary.className = "summary pass";
    summary.textContent = "✓ Сборка совместима, можно собирать.";
  }

  const total = Object.values(p).reduce((sum,item)=>sum+item.price,0);
  document.getElementById("totalPrice").textContent = total.toLocaleString("ru-RU") + " ₽";
}

update();

// ---------- Сравнение двух деталей (VS) ----------
const VS_LABELS_RU = { cpu:"Процессоры", mb:"Материнские платы", ram:"Память", gpu:"Видеокарты", psu:"Блоки питания", storage:"Накопители", case:"Корпуса" };

const vsCategorySelect = document.getElementById("vsCategory");
const vsItemASelect = document.getElementById("vsItemA");
const vsItemBSelect = document.getElementById("vsItemB");
const vsResultEl = document.getElementById("vsResult");

Object.keys(DATA).forEach(key=>{
  const opt = document.createElement("option");
  opt.value = key;
  opt.textContent = VS_LABELS_RU[key];
  vsCategorySelect.appendChild(opt);
});

function fillVsItemSelect(select, key, defaultIndex){
  select.innerHTML = "";
  DATA[key].forEach((item, i)=>{
    const opt = document.createElement("option");
    opt.value = item.id;
    opt.textContent = item.name;
    if(i === defaultIndex) opt.selected = true;
    select.appendChild(opt);
  });
}

function refreshVsPickers(){
  const key = vsCategorySelect.value;
  fillVsItemSelect(vsItemASelect, key, 0);
  fillVsItemSelect(vsItemBSelect, key, Math.min(1, DATA[key].length - 1));
  renderVs();
}

// человекочитаемые названия характеристик для таблицы сравнения
const SPEC_LABELS = {
  price:         "Цена",
  brand:         "Производитель",
  socket:        "Сокет",
  ram:           "Тип памяти",
  type:          "Тип памяти",
  cores:         "Ядра",
  threads:       "Потоки",
  boostGHz:      "Буст-частота, ГГц",
  tdp:           "TDP (Вт)",
  watt:          "Мощность (Вт)",
  certification: "Сертификация 80+",
  vramGB:        "Видеопамять, ГБ",
  bandwidth:     "Пропускная способность, ГБ/с",
  capacityGB:    "Объём, ГБ",
  frequency:     "Частота, МГц",
  readSpeed:     "Скорость чтения, МБ/с",
  airflow:       "Продуваемость (1–10, ориентировочно)",
  fans:          "Вентиляторов в комплекте",
  score:         "Производительность (баллы, ориентировочно)"
};

// ранг сертификации БП для подсветки победителя в сравнении (не числовое поле)
const CERT_RANK = { Bronze:1, Silver:2, Gold:3, Platinum:4, Titanium:5 };

function renderVs(){
  const key = vsCategorySelect.value;
  const itemA = DATA[key].find(i=>i.id===vsItemASelect.value);
  const itemB = DATA[key].find(i=>i.id===vsItemBSelect.value);
  if(!itemA || !itemB) return;

  // собираем список полей, которые есть хотя бы у одного из двух товаров (кроме id/name)
  const fields = Object.keys(itemA).filter(f=>f!=="id" && f!=="name");

  let rows = "";
  let aWins = 0, bWins = 0; // счёт побед по отдельным характеристикам
  fields.forEach(field=>{
    const valA = itemA[field];
    const valB = itemB[field];
    const label = SPEC_LABELS[field] || field;

    let cellA = valA, cellB = valB;
    let classA = "", classB = "";

    if(typeof valA === "number" && typeof valB === "number"){
      cellA = field === "price" ? valA.toLocaleString("ru-RU") + " ₽" : valA;
      cellB = field === "price" ? valB.toLocaleString("ru-RU") + " ₽" : valB;
      // для цены "лучше" — меньше, для остальных числовых полей — больше
      const higherIsBetter = field !== "price";
      if(valA !== valB){
        const aBetter = higherIsBetter ? valA > valB : valA < valB;
        if(aBetter){ classA = "vs-win"; aWins++; } else { classB = "vs-win"; bWins++; }
      }
    } else if(field === "certification" && CERT_RANK[valA] && CERT_RANK[valB]){
      // сертификация БП — не число, сравниваем по рангу (Bronze < Silver < Gold < Platinum < Titanium)
      cellA = `${valA} (80+)`;
      cellB = `${valB} (80+)`;
      if(CERT_RANK[valA] !== CERT_RANK[valB]){
        if(CERT_RANK[valA] > CERT_RANK[valB]){ classA = "vs-win"; aWins++; } else { classB = "vs-win"; bWins++; }
      }
    }

    rows += `<tr>
      <td class="vs-row-label">${label}</td>
      <td class="${classA}">${cellA}</td>
      <td class="${classB}">${cellB}</td>
    </tr>`;
  });

  // ---- полосы: не по одному случайному параметру, а по количеству характеристик,
  // в которых деталь оказалась лучше — так 32 ГБ DDR4 не "побеждает" 16 ГБ DDR5 только за счёт объёма
  const totalDecided = aWins + bWins;
  let barsHtml = "";
  if(totalDecided > 0){
    const maxWins = Math.max(aWins, bWins) || 1;
    const widthA = (aWins / maxWins) * 100;
    const widthB = (bWins / maxWins) * 100;
    const aIsWinner = aWins > bWins;
    const bIsWinner = bWins > aWins;

    barsHtml = `
      <div class="vs-bars">
        <div class="vs-bars-title">Итог по всем характеристикам</div>
        <div class="vs-bar-row">
          <div class="vs-bar-name"><span>${itemA.name}</span><span class="val">лучше по ${aWins} из ${totalDecided}</span></div>
          <div class="vs-bar-track"><div class="vs-bar-fill ${aIsWinner ? "winner" : ""}" style="width:${Math.max(widthA,4)}%"></div></div>
        </div>
        <div class="vs-bar-row">
          <div class="vs-bar-name"><span>${itemB.name}</span><span class="val">лучше по ${bWins} из ${totalDecided}</span></div>
          <div class="vs-bar-track"><div class="vs-bar-fill ${bIsWinner ? "winner" : ""}" style="width:${Math.max(widthB,4)}%"></div></div>
        </div>
      </div>
    `;
  } else {
    barsHtml = `<div class="vs-bars"><div class="vs-bars-title">Итог по всем характеристикам</div><div class="vs-bar-name"><span>Детали совпадают по всем сравнимым параметрам</span></div></div>`;
  }

  vsResultEl.innerHTML = `
    <table class="vs-table">
      <thead>
        <tr><th></th><th>${itemA.name}</th><th>${itemB.name}</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    ${barsHtml}
  `;
}

vsCategorySelect.addEventListener("change", refreshVsPickers);
vsItemASelect.addEventListener("change", renderVs);
vsItemBSelect.addEventListener("change", renderVs);

refreshVsPickers();
</script>
